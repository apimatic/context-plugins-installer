name: Release

on:
  push:
    branches: [main, beta, alpha]

permissions:
  id-token: write # required for npm OIDC trusted publishing
  contents: write # @semantic-release/git pushes the version commit and tag
  issues: write # @semantic-release/github
  pull-requests: write # @semantic-release/github comments on released PRs

jobs:
  release:
    runs-on: ubuntu-latest
    # Gate: this job does not start until a reviewer approves the deployment to
    # the `npm-publish` environment. Configure required reviewers under
    # Settings -> Environments -> npm-publish.
    environment: npm-publish
    strategy:
      matrix:
        node: ['22']
    name: Release with Node version ${{ matrix.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0 # semantic-release reads the full tag history

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # semantic-release tags and pushes before `npm publish` ever runs tsc, so a
      # compile failure would strand a tagged version that was never published.
      # Declaration emit only happens here: typecheck runs with noEmit.
      - name: Build
        run: npm run build

      # npm trusted publishing (OIDC) requires npm >= 11.5.1; the runner's bundled
      # npm (shipped with Node 22) is older, so upgrade it before publishing.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

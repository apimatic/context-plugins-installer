name: CI

on:
  push:
    # The prerelease branches too: Release runs on a direct push to them, and
    # nothing else would compile the code before it tags.
    branches: [main, beta, alpha]
  pull_request:

jobs:
  # Commit messages drive the version bump, so a malformed one silently costs a
  # release. Catch it on the PR instead.
  commitlint:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Static checks over src and test: lint, format, and the strict typecheck.
  lint:
    name: lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run syntax
      # Tests run the TypeScript sources directly through tsx: no build step
      # sits between an edit and a red or green result.
      - run: npm test

  smoke:
    name: real marketplace smoke test
    runs-on: ubuntu-latest
    # A CI install is a real install as far as telemetry is concerned, so this
    # job opts out explicitly rather than count itself as a user.
    env:
      CP_TELEMETRY: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # The published entry point runs the compiled lib/, exactly as npx would.
      - run: npm run build
      # Every other job installs devDependencies now, so this is the only place
      # the zero-runtime-dependency claim is still proved: strip the build tooling
      # and make the shipped binary do real work with nothing but node builtins.
      - run: npm prune --omit=dev
      - name: list the default marketplace
        run: node bin/cli.js list --json > /dev/null
      - name: install into a sandboxed machine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CP_STATE_DIR="$RUNNER_TEMP/state"
          export CP_CURSOR_DIR="$RUNNER_TEMP/.cursor"
          export CP_VSCODE_USER_DIR="$RUNNER_TEMP/code-user"
          mkdir -p "$CP_CURSOR_DIR" "$CP_VSCODE_USER_DIR"
          node bin/cli.js install paypal --targets cursor,vscode
          test -f "$CP_VSCODE_USER_DIR/settings.json"
          node bin/cli.js installed
          node bin/cli.js uninstall paypal --targets cursor,vscode
      # The other two sources this CLI takes, against the real thing. Every
      # other job runs the TypeScript through tsx with a stubbed fetch, so this
      # is the only place a path or a repository install meets the compiled
      # `lib/`, a real clone, and a tree with no devDependencies in it.
      - name: install from a folder on this machine
        run: |
          export CP_STATE_DIR="$RUNNER_TEMP/state"
          export CP_CURSOR_DIR="$RUNNER_TEMP/.cursor"
          export CP_VSCODE_USER_DIR="$RUNNER_TEMP/code-user"
          mkdir -p "$CP_CURSOR_DIR" "$CP_VSCODE_USER_DIR"
          # A space in the name, because the path reaches argv and every join
          # below it - and a git repository around it, because a plugin folder
          # almost always is one and its history is not part of the plugin.
          src="$RUNNER_TEMP/my plugin"
          mkdir -p "$src/.claude-plugin" "$src/skills"
          echo '{"name":"smoke-plugin","description":"a folder on this machine"}' \
            > "$src/.claude-plugin/plugin.json"
          echo '# skill' > "$src/skills/SKILL.md"
          git -C "$src" init -q
          node bin/cli.js install "$src" --targets cursor,vscode -y
          test -f "$CP_CURSOR_DIR/plugins/local/smoke-plugin/skills/SKILL.md"
          test ! -d "$CP_CURSOR_DIR/plugins/local/smoke-plugin/.git"
          # The record keys on the folder, and `update` re-reads it.
          echo '# edited' > "$src/skills/SKILL.md"
          node bin/cli.js update
          grep -q edited "$CP_CURSOR_DIR/plugins/local/smoke-plugin/skills/SKILL.md"
          node bin/cli.js uninstall smoke-plugin --targets cursor,vscode
          # The one thing an uninstall may never do to a source it was given.
          test -f "$src/.claude-plugin/plugin.json"
      - name: install from a folder inside a real repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CP_STATE_DIR="$RUNNER_TEMP/state"
          export CP_CURSOR_DIR="$RUNNER_TEMP/.cursor"
          export CP_VSCODE_USER_DIR="$RUNNER_TEMP/code-user"
          mkdir -p "$CP_CURSOR_DIR" "$CP_VSCODE_USER_DIR"
          node bin/cli.js install context-plugins/plugin-marketplace/plugins/slack \
            --targets cursor -y
          test -d "$CP_CURSOR_DIR/plugins/local/slack"
          node bin/cli.js installed
          node bin/cli.js uninstall slack --targets cursor

  # The one job that asks the `claude` binary what it made of our bytes. Every
  # other test drives a fake ProcessRunner, which asserts the argv and cannot
  # refuse a file - so the generated marketplace shipped without the `owner`
  # Claude's schema requires, and no amount of green said so. A schema this tool
  # does not own needs the tool that owns it in the loop.
  claude:
    name: claude code smoke test
    runs-on: ubuntu-latest
    env:
      CP_TELEMETRY: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev
      # Unpinned on purpose: pinning would stop this noticing the next change to
      # that schema, which is the only thing it is here to notice. The plugin
      # subcommands answer without a login, which is what makes the job possible
      # at all - no credential is configured here and none is needed.
      - run: npm install -g @anthropic-ai/claude-code
      - name: install a folder into Claude Code, and ask Claude what it holds
        run: |
          export CP_STATE_DIR="$RUNNER_TEMP/state"
          # Claude's own state, sandboxed the way CP_STATE_DIR sandboxes ours.
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          mkdir -p "$CLAUDE_CONFIG_DIR"

          # Deliberately no `version`: Claude caches a plugin at
          # plugins/cache/<marketplace>/<id>/<version>, and a manifest without one
          # caches under "unknown" - so an edited plugin lands on the same path and
          # only the removal before the install makes `update` copy anything.
          src="$RUNNER_TEMP/claude plugin"
          mkdir -p "$src/.claude-plugin" "$src/skills"
          echo '{"name":"smoke-plugin","description":"a folder on this machine"}' \
            > "$src/.claude-plugin/plugin.json"
          echo '# skill' > "$src/skills/SKILL.md"

          node bin/cli.js install "$src" --targets claude -y

          # Claude's answer, not ours. Our own record agreeing with itself is what
          # every other test already checks; this is the half that was missing.
          claude plugin marketplace list --json | grep -q context-plugins-local
          claude plugin list --json | grep -q 'smoke-plugin@context-plugins-local'

          echo '# edited' > "$src/skills/SKILL.md"
          node bin/cli.js update
          grep -q edited "$CP_STATE_DIR/marketplace/plugins/smoke-plugin/skills/SKILL.md"

          node bin/cli.js uninstall smoke-plugin --targets claude
          # The last plugin out takes the generated marketplace and its
          # registration with it, so Claude is left holding neither. Spelled with
          # a captured match rather than `grep -v`, which answers 0 whenever any
          # *other* line fails to match and so can never fail this.
          test -z "$(claude plugin list --json | grep smoke-plugin || true)"
          test -z "$(claude plugin marketplace list --json | grep context-plugins-local || true)"
          test -f "$src/.claude-plugin/plugin.json"
      # A repository that is a plugin, with Claude Code as the only target: no
      # editor copies files here, so nothing would be fetched at all unless the
      # staging half of the fetch condition holds on its own.
      - name: install a repository folder into Claude Code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CP_STATE_DIR="$RUNNER_TEMP/state-repo"
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config-repo"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          node bin/cli.js install context-plugins/plugin-marketplace/plugins/slack \
            --targets claude -y
          claude plugin list --json | grep -q 'slack@context-plugins-local'
          node bin/cli.js uninstall slack --targets claude
          test -z "$(claude plugin list --json | grep slack || true)"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Commit messages drive the version bump, so a malformed one silently costs a
  # release. Catch it on the PR instead.
  commitlint:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # The one job that needs node_modules; the test matrix below stays
  # dependency-free so the package keeps running from bare source.
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install - that is the point.
      - run: npm run syntax
      - run: npm test

  smoke:
    name: real marketplace smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: list the default marketplace
        run: node bin/cli.js list --json > /dev/null
      - name: install into a sandboxed machine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CP_STATE_DIR="$RUNNER_TEMP/state"
          export CP_CURSOR_DIR="$RUNNER_TEMP/.cursor"
          export CP_VSCODE_USER_DIR="$RUNNER_TEMP/code-user"
          mkdir -p "$CP_CURSOR_DIR" "$CP_VSCODE_USER_DIR"
          node bin/cli.js install paypal --targets cursor,vscode
          test -f "$CP_VSCODE_USER_DIR/settings.json"
          node bin/cli.js installed
          node bin/cli.js uninstall paypal --targets cursor,vscode
